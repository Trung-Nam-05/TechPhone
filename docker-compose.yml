services:
  techphone:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      SERVE_STATIC: "true"
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:4000
      API_PUBLIC_URL: http://localhost:4000
      SOCKET_CORS_ORIGIN: http://localhost:4000
      ALLOW_LOCALHOST_ORIGINS: "true"
