name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend (same-origin prod)
        run: npm run build
        env:
          VITE_API_BASE_URL: ""
          VITE_SOCKET_URL: ""

      - name: Docker build smoke test
        run: docker build -t techphone:ci .
